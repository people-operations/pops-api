spring.application.name=pops-srv-manager-api
server.port=8080
server.servlet.context-path=/api

# Database configuration
#Configurar variaveis de ambiente no em arquivo .vars dentro de resources
spring.datasource.url=jdbc:mysql://${IPV4_PRIVATE}:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
jwt.secret=pops-srv-manager-api

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
