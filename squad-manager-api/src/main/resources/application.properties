spring.application.name=squad-manager-api
server.port=8080
server.servlet.context-path=/api

# Database configuration
# Remover essa configuração e as dependências do H2 após homologação do banco de dados em SQL
spring.datasource.url=jdbc:h2:mem:pops;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

